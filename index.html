<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'"><title>Small Steps</title><link rel="stylesheet" href="design.css"><link rel="stylesheet" href="refinement.css"><link rel="icon" href="brand.svg" type="image/svg+xml"></head><body>
<aside class="sidebar">
 <a class="brand" href="#" aria-label="Small Steps home"><img src="brand.svg" alt="" width="35" height="35"><span>smallsteps<span class="brand-dot">.</span></span></a>
 <button class="search-command" id="command-search"><span data-icon="search"></span><span>Quick search</span><kbd>Ctrl K</kbd></button>
 <nav aria-label="Main navigation"><button class="nav active" data-view="today"><span data-icon="sun"></span>Today<span id="nav-count" class="nav-count">0</span></button><button class="nav" data-view="progress"><span data-icon="chart"></span>Progress</button><button class="nav" data-view="library"><span data-icon="grid"></span>Habits</button><button class="nav" data-view="journal"><span data-icon="journal"></span>Reflections</button></nav>
 <div class="sidebar-bottom"><button class="nav sub-nav" data-view="method"><span data-icon="layers"></span>The method</button><button class="nav" id="settings"><span data-icon="settings"></span>Settings</button></div>
</aside>
<main><header><h2 id="view-label">Today</h2><div class="header-right"><button class="secondary coach-toggle-btn" id="toggle-coach" title="Show or hide coach (Ctrl /)" aria-label="Toggle coach" aria-expanded="true"><span>Ask coach</span></button><button class="icon-button sound-toggle" id="sound-toggle" title="Toggle sound effects (S)" aria-label="Toggle sound"><span data-icon="volume"></span></button><button class="icon-button theme-toggle" id="theme-toggle" title="Toggle light and dark theme (M)" aria-label="Toggle theme"><span data-icon="sun"></span></button></div></header><section id="content" tabindex="-1"></section><footer><span>v1.1</span></footer></main>
 <aside class="coach" aria-label="AI habit coach"><div class="coach-head"><h3>Coach</h3><span id="coach-provider-badge" hidden></span><button class="icon-button" id="clear-chat" aria-label="Clear conversation" title="Start a new conversation"><span data-icon="newchat"></span></button><button class="icon-button" id="close-coach" aria-label="Close coach" title="Close coach"><span data-icon="close"></span></button></div><div id="coach-key-banner" class="coach-key-banner" hidden></div><div id="chat" aria-live="polite"></div><div class="coach-bottom"><div class="suggestions"><button data-kickstart="morning">Morning Kickstart <span>↗</span></button><button data-kickstart="evening">Evening Review <span>↗</span></button><button data-prompt="Help me make one of my habits easier to start.">Make it easier <span>↗</span></button><button data-prompt="Help me get back on track after missing a day.">Find my rhythm <span>↗</span></button></div><form id="chat-form"><textarea id="chat-input" rows="3" maxlength="4000" placeholder="Ask for guidance, cues, or encouragement…" aria-label="Message your habit coach"></textarea><div class="composer-bar"><button type="button" class="icon-button composer-context" id="chat-context" aria-label="Ask about a habit" title="Ask about a habit"><span data-icon="plus"></span></button><div class="composer-actions"><button type="button" class="icon-button" id="emoji-picker-button" aria-label="Choose an emoji" title="Choose an emoji" aria-haspopup="dialog" aria-expanded="false"><span data-icon="smile"></span></button><button id="send" aria-label="Send message"><span data-icon="arrowup"></span></button></div></div></form><p class="privacy" id="coach-privacy-note">Your habits give your coach context.</p><span class="composer-hint">Enter to send <span>·</span> Shift + Enter for a new line</span></div></aside>
<div id="focus-dock" hidden></div><dialog id="modal"><div id="modal-body"></div></dialog><div id="toast" role="status"></div><script src="chat-store.js"></script><script src="coach-protocol.js"></script><script src="renderer.js"></script><script src="experience.js"></script><script src="coach-habits.js"></script><script src="conversations.js"></script></body></html>
